<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAuth | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0b0f19;
            color: #e2e8f0;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== Container ===== */
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            background:
                radial-gradient(ellipse 80% 60% at 50% -20%, rgba(99, 102, 241, .15), transparent),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(139, 92, 246, .1), transparent),
                #0b0f19;
        }

        /* ===== Card ===== */
        .card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem 2rem;
            background: rgba(30, 34, 50, .65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 1.25rem;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, .03),
                0 8px 40px rgba(0, 0, 0, .45),
                0 2px 8px rgba(0, 0, 0, .25);
            animation: card-enter .5s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes card-enter {
            from { opacity: 0; transform: translateY(16px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== Header ===== */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -.02em;
            background: linear-gradient(135deg, #c7d2fe 0%, #818cf8 50%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== Form ===== */
        .form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* ===== Error Message ===== */
        .errormsg {
            display: none;
            padding: .75rem 1rem;
            font-size: .85rem;
            font-weight: 500;
            color: #fca5a5;
            background: rgba(239, 68, 68, .1);
            border: 1px solid rgba(239, 68, 68, .25);
            border-radius: .6rem;
            animation: shake .35s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-6px); }
            75%      { transform: translateX(6px); }
        }

        /* ===== Input Group ===== */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: .45rem;
        }

        .input-group label {
            font-size: .8rem;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: .03em;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: .75rem 1rem;
            font-family: inherit;
            font-size: .95rem;
            color: #f1f5f9;
            background: rgba(15, 23, 42, .6);
            border: 1px solid rgba(148, 163, 184, .15);
            border-radius: .6rem;
            outline: none;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        .input-group input::placeholder {
            color: #475569;
        }

        .input-group input:hover {
            border-color: rgba(148, 163, 184, .3);
        }

        .input-group input:focus {
            border-color: #818cf8;
            background: rgba(15, 23, 42, .8);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, .18);
        }

        /* ===== Button ===== */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: .8rem;
            margin-top: .25rem;
            font-family: inherit;
            font-size: .95rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            border: none;
            border-radius: .6rem;
            cursor: pointer;
            transition: transform .15s, box-shadow .25s, filter .25s;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.12), transparent 60%);
            opacity: 0;
            transition: opacity .25s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, .35);
        }

        .btn:hover:not(:disabled)::before {
            opacity: 1;
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* ===== Spinner ===== */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, .25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .65s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            margin-top: 1.75rem;
        }

        .footer p {
            font-size: .85rem;
            color: #64748b;
        }

        .footer a {
            color: #a5b4fc;
            text-decoration: none;
            font-weight: 500;
            transition: color .2s;
        }

        .footer a:hover {
            color: #c7d2fe;
            text-decoration: underline;
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.25rem 1.5rem;
                border-radius: 1rem;
            }

            .header h1 {
                font-size: 1.35rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Welcome to NAuth</h1>
            </div>
            <form id="form" class="form">
                <div id="errormsg" class="errormsg"></div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="text" name="email" id="email" placeholder="Enter email">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter password">
                </div>
                <button type="submit" class="btn" id="submitBtn">
                    <span id="spinner" class="spinner"></span>
                    <span id="btnTxt" >Log in</span>
                </button>
            </form>
            <div class="footer">
                <p>Don't have an account? <a href="./signup.htm">Register</a></p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('form');
        const submitBtn=document.getElementById('submitBtn');
        const spinner=document.getElementById('spinner');
        const btnTxt=document.getElementById('btnTxt');
        const errormsg=document.getElementById('errormsg');


        function showError(message){
            errormsg.textContent=message;
            errormsg.style.display='block';
        }

        function hideError(){
            errormsg.style.display='none';
        }

        function setLoading(isLoding){
            submitBtn.disabled=isLoding;

            spinner.style.display=isLoding ? 'block' : 'none';
            btnTxt.style.display=isLoding ? 'none' : 'block';
        }

        function hideSuccess(){
            successmsg.style.display='none';
        }

        form.addEventListener('submit', async(e) => {
            e.preventDefault();
            const email=document.getElementById('email').value;
            const password=document.getElementById('password').value;

            if(!email || !password){
                showError('Please enter email and password');
                return;
            }

            setLoading(true);
            hideError();

            try {
                const res=await fetch(`${window.location.origin}/auth/login`,
                {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        email,
                        password,
                        client_id:params.get('client_id'),
                        redirect_uri:params.get('redirect_uri'),
                        scope:params.get('scope'),
                        state:params.get('state')
                    })
                }
            );

                const data=await res.json();
                
                if(!res.ok){
                    showError(data.message || 'Login failed');
                }else if(data.redirect){
                    window.location.href=data.redirect; 
                }

            } catch (error) {
                showError('An error occurred. Please try again.');
            }finally{
                setLoading(false);
            }

            
            
        })


    </script>

</body>

</html>
